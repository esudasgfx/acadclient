<!--
Skill Swap Platform - Authentication (login.html)
Features: Login form, registration form, password toggle logic, API calls integration
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Swap - Access System</title>
<!-- Bootstrap 5 CSS (Frontend styling layout framework) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome 6 Icons (Icons pack) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Font: Inter (Modern aesthetic typography) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<!-- Main Custom Theme CSS -->
<link rel="stylesheet" href="css/style.css">
<style>
/* Custom CSS adjustments to support the dark theme layout */
.login-wrapper {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: linear-gradient(135deg, #0f0e17 0%, #1a1a2e 100%);
padding: 20px;
}
.login-card {
background: var(--bg-card);
border-radius: 20px;
padding: 40px;
max-width: 450px;
width: 100%;
border: 1px solid rgba(255, 255, 255, 0.05);
box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.password-toggle { position: relative; }
.password-toggle .toggle-eye {
position: absolute;
right: 12px;
top: 50%;
transform: translateY(-50%);
cursor: pointer;
color: var(--text-muted);
background: none;
border: none;
}
#signupForm { display: none; } /* Hide register card on initial load */
</style>
</head>
<body>
<div class="login-wrapper">
<div class="login-card">
<!-- Title Header section -->
<div class="text-center mb-4">
<i class="fas fa-code-branch fa-3x mb-2 text-primary"></i>
<h2 class="fw-bold m-0">SKILL <span class="text-primary">SWAP</span></h2>
<p class="text-muted small mt-1">Exchange knowledge. Level up together.</p>
</div>
<!-- A. LOGIN PANEL -->
 <div id="loginForm">
<form onsubmit="handleLogin(event)">
<div class="mb-3">
<label class="form-label text-muted small"><i class="fas fa-envelope me-1"></i>Email Address</label>
<input type="email" class="form-control" id="loginEmail" placeholder="you@school.com" required>
</div>
<div class="mb-3">
<label class="form-label text-muted small"><i class="fas fa-lock me-1"></i>Access Code</label>
<div class="password-toggle">
<input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
<button type="button" class="toggle-eye" onclick="togglePassword('loginPassword')">
<i class="fas fa-eye"></i>
</button>
</div>
</div>
<button type="submit" class="btn btn-primary w-100 mt-2" id="loginBtn">
<i class="fas fa-sign-in-alt me-1"></i> Access System
</button>
<div class="alert alert-danger mt-3 py-2 px-3 small text-center" id="loginError" style="display: none;"></div>
</form>
<div class="text-center mt-4 small text-muted">
New operative? <a href="#" onclick="showSignup()" class="text-primary text-decoration-none">Initialize Credentials</a>
</div>
</div>
<!-- B. REGISTRATION PANEL (Hidden initially) -->
<div id="signupForm">
<form onsubmit="handleSignup(event)">
<div class="mb-3">
<label class="form-label text-muted small"><i class="fas fa-user me-1"></i>Full Name</label>
<input type="text" class="form-control" id="signupName" placeholder="Agent Smith" required>
</div>
<div class="mb-3">
<label class="form-label text-muted small"><i class="fas fa-envelope me-1"></i>School Email</label>
<input type="email" class="form-control" id="signupEmail" placeholder="agent@school.com" required>
</div>
<div class="mb-3">
<label class="form-label text-muted small"><i class="fas fa-lock me-1"></i>Create Access Code</label>
<div class="password-toggle">
<input type="password" class="form-control" id="signupPassword" placeholder="Minimum 6 characters" required minlength="6">
<button type="button" class="toggle-eye" onclick="togglePassword('signupPassword')">
<i class="fas fa-eye"></i>
</button>
</div>
</div>
<div class="mb-3">
<label class="form-label text-muted small"><i class="fas fa-graduation-cap me-1"></i>Primary Skill (Offered)</label>
<input type="text" class="form-control" id="signupSkillsOffer" placeholder="e.g. Python Programming" required>
</div>
<div class="mb-3">
<label class="form-label text-muted small"><i class="fas fa-brain me-1"></i>Target Skill (Wanted)</label>
<input type="text" class="form-control" id="signupSkillsWant" placeholder="e.g. Graphic Design" required>
</div>
<button type="submit" class="btn btn-success w-100 mt-2" id="signupBtn">
<i class="fas fa-user-plus me-1"></i> Deploy Agent
</button>
<div class="alert alert-danger mt-3 py-2 px-3 small text-center" id="signupError" style="display: none;"></div>
<div class="alert alert-success mt-3 py-2 px-3 small text-center" id="signupSuccess" style="display: none;"></div>
</form>
<div class="text-center mt-4 small text-muted">
Already authorized? <a href="#" onclick="showLogin()" class="text-primary text-decoration-none">Return to Access</a>
</div>
</div>
</div>
</div>
<!-- JS Scripts Import -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script>
// Toggles visibility of input field values
function togglePassword(inputId) {
const input = document.getElementById(inputId);
const icon = input.parentElement.querySelector('.toggle-eye i');
if (input.type === 'password') {
input.type = 'text';
icon.className = 'fas fa-eye-slash';
} else {
input.type = 'password';
icon.className = 'fas fa-eye';
}
}
// Interactive panel togglers
function showSignup() {
document.getElementById('loginForm').style.display = 'none';
document.getElementById('signupForm').style.display = 'block';
}
function showLogin() {
document.getElementById('loginForm').style.display = 'block';
document.getElementById('signupForm').style.display = 'none';
}
// Submits login requests to database via the API client wrapper
async function handleLogin(event) {
event.preventDefault(); // Prevents page reload
const email = document.getElementById('loginEmail').value.trim();
const password = document.getElementById('loginPassword').value;
const errorEl = document.getElementById('loginError');
const btn = document.getElementById('loginBtn');
errorEl.style.display = 'none';
btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Authenticating...';
btn.disabled = true;
try {
const result = await SkillSwapDB.login(email, password);
if (result.success) {
// Save session state to browser's LocalStorage
localStorage.setItem('currentUser', JSON.stringify(result.user));
btn.innerHTML = '<i class="fas fa-check me-1"></i> Authorized!';
setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
}
} catch (error) {
errorEl.textContent = error.message;
errorEl.style.display = 'block';
btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Access System';
btn.disabled = false;
}
}
// Handles user signup
async function handleSignup(event) {
event.preventDefault(); // Prevents page reload
const name = document.getElementById('signupName').value.trim();
const email = document.getElementById('signupEmail').value.trim();
const password = document.getElementById('signupPassword').value;
const skillsOffered = [document.getElementById('signupSkillsOffer').value.trim()];
const skillsWanted = [document.getElementById('signupSkillsWant').value.trim()];
const errorEl = document.getElementById('signupError');
const successEl = document.getElementById('signupSuccess');
const btn = document.getElementById('signupBtn');
errorEl.style.display = 'none';
successEl.style.display = 'none';
btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Deploying...';
btn.disabled = true;
try {
const result = await SkillSwapDB.signup(name, email, password, skillsOffered, skillsWanted);
if (result.success) {
localStorage.setItem('currentUser', JSON.stringify(result.user));
successEl.textContent = 'Account created successfully! Redirecting...';
successEl.style.display = 'block';
btn.innerHTML = '<i class="fas fa-check-circle me-1"></i> Deployed!';
setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
}
} catch (error) {
errorEl.textContent = error.message;
errorEl.style.display = 'block';
btn.innerHTML = '<i class="fas fa-user-plus me-1"></i> Deploy Agent';
btn.disabled = false;
}
}
</script>
</body>
</html>
