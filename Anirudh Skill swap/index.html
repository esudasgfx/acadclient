<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Swap</title>
    <!-- Favicon / Meta -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Check authentication state immediately
        const user = localStorage.getItem('currentUser');
        if (user) {
            window.location.replace('dashboard.html');
        } else {
            window.location.replace('login.html');
        }
    </script>
</head>
<body style="background: #0f0e17; color: #fffffe; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Inter', sans-serif;">
    <div class="text-center">
        <i class="fas fa-code-branch fa-3x text-primary mb-3"></i>
        <h3 class="fw-bold">SKILL <span class="text-primary">SWAP</span></h3>
        <p class="text-muted small"><i class="fas fa-spinner fa-spin me-2"></i>Loading system...</p>
    </div>
</body>
</html>
